<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#06152b">
<title>MBA Newsletters | SRMIST Trichy — Faculty of Management</title>
<meta name="description" content="Digital newsletters of the Faculty of Management, SRM Institute of Science and Technology, Tiruchirappalli. MBA Newsletter and MBA Healthcare &amp; Hospital Management Newsletter.">
<link rel="canonical" href="./">
<style>
:root{
  --navy:#06152b; --navy2:#0a2343; --gold:#e1b84b; --mint:#63c8b2;
  --text:#f6f9fd; --muted:#b7c8dc;
  --safe-t:env(safe-area-inset-top,0px); --safe-b:env(safe-area-inset-bottom,0px);
}
*{box-sizing:border-box}
html,body{margin:0;padding:0;background:var(--navy);color:var(--text);
  font-family:"Segoe UI",-apple-system,BlinkMacSystemFont,Roboto,Arial,sans-serif;
  -webkit-text-size-adjust:100%;overscroll-behavior:none}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
:focus-visible{outline:2px solid var(--gold);outline-offset:2px;border-radius:4px}
.sr{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;
  clip:rect(0 0 0 0);white-space:nowrap;border:0}

/* ---------- HOME ---------- */
#home{min-height:100dvh;display:flex;flex-direction:column;align-items:center;
  justify-content:center;padding:calc(40px + var(--safe-t)) 20px calc(40px + var(--safe-b));
  background:radial-gradient(circle at 50% 0,#174b82 0,#0b2749 34%,#06152b 76%);text-align:center}
.eyebrow{font-size:11px;letter-spacing:.24em;color:#f1d47f;font-weight:800;margin:0 0 12px}
h1{font-size:clamp(34px,7vw,68px);line-height:.96;margin:0 0 14px;letter-spacing:-.035em;
  text-shadow:0 8px 35px #0008}
.sub{color:#c5d5e8;max-width:640px;margin:0 auto 8px;line-height:1.55;font-size:15px}
.year{display:inline-block;margin:6px 0 38px;color:#f1d47f;font-size:13px;font-weight:700;letter-spacing:.08em}
.grid{display:grid;gap:26px;width:min(860px,100%);
  grid-template-columns:repeat(auto-fit,minmax(240px,1fr))}
.card{background:linear-gradient(160deg,#ffffff10,#ffffff05);border:1px solid #ffffff1f;
  border-radius:16px;padding:18px;display:flex;flex-direction:column;gap:14px;
  transition:transform .22s ease,border-color .22s ease,box-shadow .22s ease;text-align:left}
.card:hover,.card:focus-within{transform:translateY(-4px);border-color:#e1b84b66;
  box-shadow:0 18px 40px #00000059}
.card img{width:100%;aspect-ratio:1/1.414;object-fit:cover;object-position:top;
  border-radius:9px;background:#0d2748;display:block;box-shadow:0 8px 22px #0006}
.card h2{font-size:17px;margin:0;line-height:1.3}
.card .meta{font-size:12px;color:var(--muted);margin:-8px 0 0}
.open{margin-top:auto;background:var(--gold);color:#1a1205;font-weight:700;font-size:14px;
  padding:11px 16px;border-radius:9px;text-align:center;letter-spacing:.02em}
.open:hover{filter:brightness(1.07)}
.pdf{font-size:11.5px;color:#8fa6c0;text-align:center;text-decoration:none;
  letter-spacing:.04em;margin-top:-6px}
.pdf:hover{color:var(--gold);text-decoration:underline}
.foot{margin-top:40px;font-size:12px;color:#7f97b4;line-height:1.9}
.foot a{color:#9fb6d2}

/* ---------- READER ---------- */
#reader{position:fixed;inset:0;background:#050f1f;display:none;flex-direction:column;z-index:50}
#reader.on{display:flex}
.bar{display:flex;align-items:center;gap:10px;padding:calc(8px + var(--safe-t)) 12px 8px;
  background:#06152bef;border-bottom:1px solid #ffffff14;flex:0 0 auto;
  backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px)}
.bar .title{font-size:14px;font-weight:600;white-space:nowrap;overflow:hidden;
  text-overflow:ellipsis;flex:1;min-width:0}
.ico{width:38px;height:38px;display:grid;place-items:center;border-radius:9px;flex:0 0 auto}
.ico:hover{background:#ffffff14}
.ico svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:2;
  stroke-linecap:round;stroke-linejoin:round}

#stage{flex:1;min-height:0;position:relative;overflow:hidden;touch-action:pan-y pinch-zoom;
  display:grid;place-items:center;background:#050f1f}
#pane{will-change:transform;transform-origin:0 0;display:grid;place-items:center;
  width:100%;height:100%}
#page{max-width:100%;max-height:100%;object-fit:contain;display:block;
  box-shadow:0 6px 30px #0009;background:#0d2748}
#spin{position:absolute;width:34px;height:34px;border:3px solid #ffffff26;
  border-top-color:var(--gold);border-radius:50%;animation:sp .8s linear infinite;display:none}
#spin.on{display:block}
@keyframes sp{to{transform:rotate(360deg)}}
@media(prefers-reduced-motion:reduce){#spin{animation-duration:2s}.card{transition:none}}

.nav{display:flex;align-items:center;justify-content:center;gap:8px;
  padding:8px 12px calc(8px + var(--safe-b));background:#06152bef;
  border-top:1px solid #ffffff14;flex:0 0 auto}
.nav button{width:44px;height:40px;display:grid;place-items:center;border-radius:9px;
  background:#ffffff10;border:1px solid #ffffff1a}
.nav button:disabled{opacity:.3;cursor:default}
.nav button:not(:disabled):hover{background:#ffffff1f}
.nav svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:2.2;
  stroke-linecap:round;stroke-linejoin:round}
#counter{font-size:14px;font-variant-numeric:tabular-nums;min-width:88px;text-align:center;
  color:#dbe6f4}
#jump{width:56px;background:#ffffff10;border:1px solid #ffffff26;color:var(--text);
  border-radius:7px;padding:7px 6px;text-align:center;font-size:14px}

/* search */
#find{display:none;padding:10px 12px;background:#071a33;border-bottom:1px solid #ffffff14;
  flex:0 0 auto;gap:8px;align-items:center}
#find.on{display:flex}
#q{flex:1;min-width:0;background:#ffffff0f;border:1px solid #ffffff26;color:var(--text);
  border-radius:8px;padding:9px 12px;font-size:14px}
#hits{position:absolute;left:0;right:0;top:0;max-height:100%;overflow:auto;z-index:5;
  background:#07182ffa;display:none;padding:6px 0}
#hits.on{display:block}
#hits button{display:block;width:100%;text-align:left;padding:11px 16px;font-size:13px;
  line-height:1.5;border-bottom:1px solid #ffffff0f;color:#cfdcec}
#hits button:hover{background:#ffffff12}
#hits b{color:var(--gold);font-weight:700}
#hits .pn{display:block;font-size:11px;color:#7f97b4;margin-bottom:3px;letter-spacing:.06em}
.note{padding:14px 16px;font-size:13px;color:#8fa6c0;text-align:center}
</style>
</head>
<body>

<main id="home">
  <p class="eyebrow">SRMIST TIRUCHIRAPPALLI</p>
  <h1>MBA Newsletters</h1>
  <p class="sub">Faculty of Management, SRM Institute of Science and Technology</p>
  <span class="year">LEARN · LEAP · LEAD</span>

  <div class="grid" id="grid"></div>

  <p class="foot">
    <a href="archive.html">Text version of all newsletters</a> — searchable and screen-reader friendly<br>
    © SRM Institute of Science and Technology, Tiruchirappalli · Faculty of Management
  </p>
</main>

<section id="reader" role="dialog" aria-modal="true" aria-label="Newsletter reader">
  <header class="bar">
    <button class="ico" id="back" aria-label="Back to all newsletters">
      <svg viewBox="0 0 24 24"><path d="M15 18l-6-6 6-6"/></svg>
    </button>
    <span class="title" id="rTitle"></span>
    <button class="ico" id="fBtn" aria-label="Search this newsletter">
      <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>
    </button>
  </header>

  <div id="find">
    <input id="q" type="search" placeholder="Search this newsletter…" aria-label="Search this newsletter" autocomplete="off">
    <button class="ico" id="fClose" aria-label="Close search">
      <svg viewBox="0 0 24 24"><path d="M18 6L6 18M6 6l12 12"/></svg>
    </button>
  </div>

  <div id="stage">
    <div id="pane"><img id="page" alt=""></div>
    <div id="spin"></div>
    <div id="hits"></div>
  </div>

  <p id="pageText" class="sr" aria-live="polite"></p>

  <nav class="nav" aria-label="Page navigation">
    <button id="prev" aria-label="Previous page">
      <svg viewBox="0 0 24 24"><path d="M15 18l-6-6 6-6"/></svg>
    </button>
    <span id="counter"><input id="jump" type="text" inputmode="numeric" aria-label="Go to page"> <span id="total"></span></span>
    <button id="next" aria-label="Next page">
      <svg viewBox="0 0 24 24"><path d="M9 6l6 6-6 6"/></svg>
    </button>
  </nav>
</section>

<script>
(function(){
"use strict";

var BOOKS = {
  mba: {
    title: "MBA Newsletter",
    meta: "August 2026 · Volume 01, Issue 01 · 65 pages",
    pages: 65,
    pdf: "MBA_Newsletter.pdf",
    mb: 42,
    ocr: false
  },
  healthcare: {
    title: "MBA Healthcare & Hospital Management",
    meta: "Aug 2025 – Apr 2026 · Volume 01 · 24 pages",
    pages: 24,
    pdf: "MBA_Healthcare_Newsletter.pdf",
    mb: 9,
    ocr: true
  }
};

var $ = function(id){ return document.getElementById(id); };
var stage=$("stage"), pane=$("pane"), img=$("page"), spin=$("spin"),
    prev=$("prev"), next=$("next"), jump=$("jump"), total=$("total"),
    reader=$("reader"), rTitle=$("rTitle"), pageText=$("pageText"),
    find=$("find"), q=$("q"), hits=$("hits");

var book=null, key=null, cur=1, text=null, cache={};

/* ---------- home ---------- */
(function buildHome(){
  var g=$("grid"), html="";
  for(var k in BOOKS){
    var b=BOOKS[k];
    html+='<article class="card">'+
      '<img src="assets/cover-'+k+'.webp" alt="Cover of the '+b.title+'" loading="eager" width="700" height="990">'+
      '<h2>'+b.title+'</h2>'+
      '<p class="meta">'+b.meta+'</p>'+
      '<button class="open" data-k="'+k+'">Open reader</button>'+
      '<a class="pdf" href="'+b.pdf+'" target="_blank" rel="noopener">PDF ('+b.mb+' MB)</a>'+
      '</article>';
  }
  g.innerHTML=html;
  g.addEventListener("click", function(e){
    var t=e.target.closest("[data-k]");
    if(t) open(t.getAttribute("data-k"), 1);
  });
})();

/* ---------- image helpers ---------- */
function src(k,n){ return "assets/"+k+"/page-"+n+".webp"; }

function preload(n){
  for(var d=-2; d<=2; d++){
    var p=n+d;
    if(p<1 || p>book.pages || p===n || cache[key+"/"+p]) continue;
    var i=new Image(); i.src=src(key,p); cache[key+"/"+p]=i;
  }
}

function show(n, push){
  if(!book) return;
  n=Math.max(1, Math.min(book.pages, n));
  cur=n; resetZoom();
  spin.classList.add("on");
  img.alt = book.title+", page "+n+" of "+book.pages;
  img.src = src(key,n);
  jump.value = n;
  prev.disabled = (n===1);
  next.disabled = (n===book.pages);
  if(text && text[n-1]) pageText.textContent = text[n-1];
  else pageText.textContent = "Page "+n+" of "+book.pages;
  preload(n);
  if(push!==false) history.replaceState(null,"","#"+key+"-"+n);
}
img.addEventListener("load", function(){ spin.classList.remove("on"); });
img.addEventListener("error", function(){ spin.classList.remove("on"); });

/* ---------- open / close ---------- */
function open(k, n){
  key=k; book=BOOKS[k];
  if(!book) return;
  rTitle.textContent = book.title;
  total.textContent = "/ "+book.pages;
  reader.classList.add("on");
  document.body.style.overflow="hidden";
  show(n||1);
  loadText(k);
  $("back").focus();
}
function close(){
  reader.classList.remove("on");
  document.body.style.overflow="";
  history.replaceState(null,"",location.pathname+location.search);
  closeFind();
}
$("back").addEventListener("click", close);

/* ---------- text layer ---------- */
function loadText(k){
  text=null;
  fetch("assets/text-"+k+".json")
    .then(function(r){ return r.ok ? r.json() : null; })
    .then(function(d){
      if(!d) return;
      text=d;
      if(text[cur-1]) pageText.textContent=text[cur-1];
    })
    .catch(function(){});
}

/* ---------- search ---------- */
$("fBtn").addEventListener("click", function(){
  find.classList.toggle("on");
  if(find.classList.contains("on")) q.focus(); else closeFind();
});
$("fClose").addEventListener("click", closeFind);
function closeFind(){
  find.classList.remove("on"); hits.classList.remove("on");
  hits.innerHTML=""; q.value="";
}
var tmr;
q.addEventListener("input", function(){
  clearTimeout(tmr);
  tmr=setTimeout(runFind, 160);
});
function esc(s){ return s.replace(/[&<>"]/g, function(c){
  return ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"})[c]; }); }
function runFind(){
  var term=q.value.trim();
  if(!text){ hits.innerHTML='<p class="note">Text for this newsletter is still loading…</p>';
    hits.classList.add("on"); return; }
  if(term.length<2){ hits.classList.remove("on"); hits.innerHTML=""; return; }
  var low=term.toLowerCase(), out="", found=0;
  for(var i=0;i<text.length;i++){
    var t=text[i]||"", at=t.toLowerCase().indexOf(low);
    if(at<0) continue;
    found++;
    var a=Math.max(0,at-45), b=Math.min(t.length, at+term.length+65);
    var frag=(a>0?"…":"")+esc(t.slice(a,at))+"<b>"+esc(t.slice(at,at+term.length))+"</b>"+
             esc(t.slice(at+term.length,b))+(b<t.length?"…":"");
    out+='<button data-p="'+(i+1)+'"><span class="pn">PAGE '+(i+1)+'</span>'+frag+'</button>';
    if(found>=40) break;
  }
  hits.innerHTML = out || '<p class="note">No results for “'+esc(term)+'”.</p>';
  hits.classList.add("on");
}
hits.addEventListener("click", function(e){
  var t=e.target.closest("[data-p]");
  if(t){ show(parseInt(t.getAttribute("data-p"),10)); closeFind(); }
});

/* ---------- navigation ---------- */
prev.addEventListener("click", function(){ show(cur-1); });
next.addEventListener("click", function(){ show(cur+1); });
jump.addEventListener("change", function(){
  var n=parseInt(jump.value,10);
  if(isNaN(n)) jump.value=cur; else show(n);
});
jump.addEventListener("keydown", function(e){
  if(e.key==="Enter"){ e.preventDefault(); jump.blur(); }
});
document.addEventListener("keydown", function(e){
  if(!reader.classList.contains("on")) return;
  if(document.activeElement===q || document.activeElement===jump){
    if(e.key==="Escape"){ closeFind(); stage.focus(); }
    return;
  }
  if(e.key==="ArrowRight"||e.key==="PageDown"){ e.preventDefault(); show(cur+1); }
  else if(e.key==="ArrowLeft"||e.key==="PageUp"){ e.preventDefault(); show(cur-1); }
  else if(e.key==="Home"){ e.preventDefault(); show(1); }
  else if(e.key==="End"){ e.preventDefault(); show(book.pages); }
  else if(e.key==="Escape"){ close(); }
});

/* ---------- zoom + swipe ---------- */
var z=1, tx=0, ty=0, MAXZ=4;
function apply(){ pane.style.transform="translate("+tx+"px,"+ty+"px) scale("+z+")"; }
function resetZoom(){ z=1; tx=0; ty=0; pane.style.transition="none"; apply();
  requestAnimationFrame(function(){ pane.style.transition=""; }); }
function clamp(){
  var r=stage.getBoundingClientRect();
  var mx=Math.max(0,(r.width*z-r.width)/2), my=Math.max(0,(r.height*z-r.height)/2);
  tx=Math.max(-mx,Math.min(mx,tx)); ty=Math.max(-my,Math.min(my,ty));
}
function zoomAt(nz, cx, cy){
  var r=stage.getBoundingClientRect();
  var px=cx-r.left, py=cy-r.top;
  var k=nz/z;
  tx = px - k*(px - tx);
  ty = py - k*(py - ty);
  z = nz; clamp(); apply();
}

var pts={}, startD=0, startZ=1, panning=false, lastX=0, lastY=0,
    sx=0, sy=0, st=0, moved=false, lastTap=0, tapX=0;

stage.addEventListener("pointerdown", function(e){
  pts[e.pointerId]={x:e.clientX,y:e.clientY};
  var n=Object.keys(pts).length;
  if(n===1){
    sx=e.clientX; sy=e.clientY; st=Date.now(); moved=false;
    if(z>1){ panning=true; lastX=e.clientX; lastY=e.clientY;
      stage.setPointerCapture(e.pointerId); }
  } else if(n===2){
    panning=false;
    var k=Object.keys(pts), a=pts[k[0]], b=pts[k[1]];
    startD=Math.hypot(a.x-b.x, a.y-b.y); startZ=z;
  }
});
stage.addEventListener("pointermove", function(e){
  if(!pts[e.pointerId]) return;
  pts[e.pointerId]={x:e.clientX,y:e.clientY};
  var k=Object.keys(pts);
  if(k.length===2 && startD>0){
    var a=pts[k[0]], b=pts[k[1]];
    var d=Math.hypot(a.x-b.x,a.y-b.y);
    var nz=Math.max(1, Math.min(MAXZ, startZ*(d/startD)));
    zoomAt(nz,(a.x+b.x)/2,(a.y+b.y)/2);
    moved=true;
  } else if(panning){
    tx += e.clientX-lastX; ty += e.clientY-lastY;
    lastX=e.clientX; lastY=e.clientY; clamp(); apply(); moved=true;
  } else {
    if(Math.abs(e.clientX-sx)>10) moved=true;
  }
});
function up(e){
  var wasTwo = Object.keys(pts).length===2;
  delete pts[e.pointerId];
  if(Object.keys(pts).length<2) startD=0;
  if(panning && Object.keys(pts).length===0) panning=false;
  if(wasTwo) return;
  // swipe (only when not zoomed)
  if(z<=1){
    var dx=e.clientX-sx, dy=e.clientY-sy, dt=Date.now()-st;
    if(Math.abs(dx)>55 && Math.abs(dx)>Math.abs(dy)*1.6 && dt<700){
      show(dx<0 ? cur+1 : cur-1); return;
    }
  }
  // double tap
  if(!moved && Date.now()-lastTap<300 && Math.abs(e.clientX-tapX)<30){
    lastTap=0;
    if(z>1) resetZoom(); else zoomAt(2.5, e.clientX, e.clientY);
  } else if(!moved){
    lastTap=Date.now(); tapX=e.clientX;
  }
  if(z<=1 && (tx!==0||ty!==0)) resetZoom();
}
stage.addEventListener("pointerup", up);
stage.addEventListener("pointercancel", function(e){ delete pts[e.pointerId]; startD=0; panning=false; });

stage.addEventListener("wheel", function(e){
  if(!e.ctrlKey) return;
  e.preventDefault();
  zoomAt(Math.max(1,Math.min(MAXZ, z*(e.deltaY<0?1.12:0.89))), e.clientX, e.clientY);
}, {passive:false});
stage.addEventListener("dblclick", function(e){
  if(e.pointerType==="touch") return;
  if(z>1) resetZoom(); else zoomAt(2.5, e.clientX, e.clientY);
});

/* ---------- deep links ---------- */
function fromHash(){
  var m=/^#([a-z]+)-(\d+)$/.exec(location.hash||"");
  if(m && BOOKS[m[1]]) open(m[1], parseInt(m[2],10));
}
window.addEventListener("hashchange", function(){
  if(!location.hash){ if(reader.classList.contains("on")) close(); return; }
  fromHash();
});
fromHash();

})();
</script>
</body>
</html>
